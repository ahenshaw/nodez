# Builds the demo and the editor examples for the browser and publishes them
# to GitHub Pages, so the README can link to something you can try without
# installing anything.
name: Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Straight from trunk's releases: the trunk action still runs on Node 20.
      - name: Install trunk
        run: |
          curl -sSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C ~/.cargo/bin
      # The demo at the root, and each editor example in a directory of its
      # own. The demo goes first: trunk empties its dist directory.
      - name: Build
        env:
          SITE: /${{ github.event.repository.name }}
        run: |
          (cd nodez-demo && trunk build --release --public-url "$SITE/" --dist ../target/pages)
          for example in quickstart blender_nodes gnuradio futuresdr; do
            (cd nodez && trunk build examples/index.html --release --example "$example" \
              --public-url "$SITE/$example/" --dist "../target/pages/$example")
          done
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

[package]
name = "nodez"
description = "A Blender-style node editor widget for egui, with a typed, traversable graph model."
keywords = ["egui", "node", "graph", "editor", "gui"]
categories = ["gui"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["serde"]
serde = ["dep:serde", "egui/serde"]

[dependencies]
egui = { workspace = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

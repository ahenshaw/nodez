[package]
name = "nodez"
description = "A Blender-style node editor widget for egui, with a typed, traversable graph model."
keywords = ["egui", "node", "graph", "editor", "gui"]
categories = ["gui"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["serde"]
serde = ["dep:serde", "egui/serde"]
# Prototype: describe nodes as Rust types with #[derive(Node)].
derive = ["dep:nodez-derive"]

[dependencies]
nodez-derive = { path = "../nodez-derive", version = "0.1.0", optional = true }
egui = { workspace = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
eframe = { workspace = true }

[[example]]
name = "typed_nodes"
required-features = ["derive"]

[package]
name = "nodez"
description = "A Blender-style node editor widget for egui, with a typed, traversable graph model."
keywords = ["egui", "node", "graph", "editor", "gui"]
categories = ["gui"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"

# docs.rs builds default features only, which would leave `derive` and `app`
# out of the published docs entirely.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["serde"]
# `serde_json` comes with it because a node group is read and written as a
# JSON file, and `nodez::group` is gated on this feature rather than on `app`.
serde = ["dep:serde", "dep:serde_json", "egui/serde"]
# Prototype: describe nodes as Rust types with #[derive(NodeType)].
derive = ["dep:nodez-derive"]
# A ready-made editor window around the widget. In a browser it also needs
# the web bindings, to find a canvas and keep files in local storage.
app = ["dep:eframe", "serde", "dep:wasm-bindgen-futures", "dep:web-sys"]

[dependencies]
nodez-derive = { path = "../nodez-derive", version = "0.6.0", optional = true }
egui = { workspace = true }
eframe = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Blob",
    "BlobPropertyBag",
    "CssStyleDeclaration",
    "Document",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "Location",
    "Storage",
    "Url",
    "console",
    "Window",
] }

[dev-dependencies]
serde_json = { workspace = true }
eframe = { workspace = true }

[[example]]
name = "typed_nodes"
required-features = ["derive"]

[[example]]
name = "quickstart"
required-features = ["derive", "app"]

[[example]]
name = "readme_check"
required-features = ["derive", "app"]

[[example]]
name = "blender_nodes"
required-features = ["derive", "app"]

[[example]]
name = "gnuradio"
required-features = ["derive", "app"]

[[example]]
name = "futuresdr"
required-features = ["derive", "app"]

[package]
name = "nodez-py"
description = "Python bindings for the nodez node editor and graph model."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Renamed to `nodez.so` on install; the module entry point is `PyInit_nodez`,
# which comes from the `#[pymodule] fn nodez` below.
name = "nodez_py"
crate-type = ["cdylib"]

[dependencies]
nodez = { path = "../nodez" }
egui = { workspace = true }
eframe = { workspace = true }
serde_json = { workspace = true }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
